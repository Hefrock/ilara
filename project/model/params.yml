# WP6b simulator parameters. Status as in docs/sources.md; UNVERIFIED values are priors to be
# confirmed from the literature (U12, U13) before calibration (6c) and are not fixed.

disease:
  # guerra2017 (docs/references): 12-18 is "often cited" but rigorous estimates "vary more";
  # the review's medians by setting are still to read, so this range stays UNVERIFIED.
  r0: {low: 12.0, high: 18.0, status: UNVERIFIED, register: U12, source: "S7, general knowledge; guerra2017 (doi:10.1016/S1473-3099(17)30307-9) says too narrow"}
  # Latent (exposed, not yet infectious) and infectious periods in days, each split into stages
  # (Erlang stays, simulator.py). Infectious window is 4 days before to 4 days after rash (S7,
  # VERIFIED), so about 8 days. Mean generation time (simulator.generation_time) must match
  # klinkenberg2011 (VERIFIED, 11-12 days) and vink2014 (VERIFIED, mean measles serial interval
  # 11.7 days); with these values it is 12.0 days (tested). Single geometric stages gave 16 days.
  # The latent mean of 7 days and the stage counts are a model choice to fit that generation
  # time, not observed values, so latent stays UNVERIFIED (U13).
  latent_days: {value: 7.0, stages: 4, status: UNVERIFIED, register: U13}
  infectious_days: {value: 8.0, stages: 4, status: VERIFIED, source: "S7, DOH measles page"}
  generation_time_days: {low: 11.0, high: 12.0, status: VERIFIED, source: "klinkenberg2011 (doi:10.1016/j.jtbi.2011.06.015); vink2014 (doi:10.1093/aje/kwu209) serial interval 11.7"}

# Coupling between counties. Each strength is the share of a county's contacts made through
# that link; zero switches the link off (T6.9). Compared, not assumed (S11).
coupling:
  commuting: {strength: 0.05, source: "mobility_edge, ACS 2016-2020 commuting flows"}
  adjacency: {strength: 0.02, source: "county_adjacency, shared boundary length"}
  long_range: {strength: 0.0, links: [], status: ASSUMPTION, note: "groups of linked counties; no T1 source, off by default"}

# Expected external exposures per day, statewide, spread by population (S11: other states'
# outbreaks; no cross-state mobility data).
external_introductions_per_day: {value: 0.0, status: ASSUMPTION}
