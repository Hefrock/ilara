# Source registry (HANDOFF 4.2). Facts about each source live in docs/sources.md;
# this file is the machine-readable list the capture layer reads.
#
# access_path: browser (Playwright, one navigation per capture), http (polite fetcher),
#              seed (loaded from data/seed or data/sensitivity/seed), none (not captured yet).
# url_status:  candidate = taken from search results or memory, not yet confirmed against
#              docs/sources.md or a successful capture; verified = confirmed.
# robots_checked_utc / last_verified_utc are filled from the first successful capture.

sources:
