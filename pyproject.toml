[project]
name = "measles-pa"
version = "0.1.0"
description = "Provenance-first Pennsylvania measles data archive and county model (unofficial, independent)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "httpx",
    "openpyxl",
    "playwright",
    "plotly>=7.1.0",
    "polars",
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
    "xlrd",
]

[project.optional-dependencies]
geo = ["geopandas", "pyogrio", "shapely"]

[dependency-groups]
dev = ["hypothesis", "mypy", "pytest", "ruff", "types-PyYAML"]

[project.scripts]
measles = "ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "project"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.12"
packages = ["ingest", "project"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["network: needs live network (deselected by default)"]
addopts = "-m 'not network'"
